name: routiqo
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: routiqo
      POSTGRES_USER: routiqo_local
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5442:5432"]
    volumes: ["routiqo-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routiqo_local -d routiqo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["127.0.0.1:6392:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: routiqo_local
      MINIO_ROOT_PASSWORD: local-storage-only
    ports: ["127.0.0.1:9020:9000", "127.0.0.1:9021:9001"]
    volumes: ["routiqo-storage:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  routiqo-postgres:
  routiqo-storage:

