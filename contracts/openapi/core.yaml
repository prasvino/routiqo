                      additionalProperties: false
                      required: [id, label, coordinate]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 512 }
                        label: { type: string, minLength: 1, maxLength: 512 }
                        coordinate: { $ref: '#/components/schemas/RouteCoordinate' }
        '400': { description: Invalid exact JSON search request }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: 'Place provider, session or rate infrastructure unavailable. Empty response body.' }
  /api/v1/native/routes:
    post:
      operationId: calculateNativePrivateRoute
      security: [{ nativeBearer: [] }]
      description: 'Separately default-off explicit owner route estimate through the configured provider. Twenty requests per account per minute shared with browser; no journey or presence mutation.'
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, origin, destination]
              properties:
                mode: { type: string, enum: [driving, walking, cycling] }
                origin: { $ref: '#/components/schemas/RouteCoordinate' }
                destination: { $ref: '#/components/schemas/RouteCoordinate' }
      responses:
        '200':
          description: Private normalized route estimates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider, calculatedAt, routes]
                properties:
                  provider: { type: string, enum: [mapbox, valhalla] }
                  calculatedAt: { type: string, format: date-time }
                  routes:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      additionalProperties: false
                      required: [distanceMetres, durationSeconds, geometry, steps]
                      properties:
                        distanceMetres: { type: number, minimum: 0 }
                        durationSeconds: { type: number, minimum: 0 }
                        geometry:
                          type: array
                          minItems: 2
                          maxItems: 10000
                          items: { $ref: '#/components/schemas/RouteCoordinate' }
                        steps:
                          type: array
                          maxItems: 500
                          items: { $ref: '#/components/schemas/RouteStep' }
        '400': { description: Invalid exact JSON mode or endpoints }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '422': { description: 'Route endpoints or returned geometry exceed configured coverage. Empty response body.' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: 'Routing provider, session or rate infrastructure unavailable. Empty response body.' }
  /api/v1/routes/places:
    post:
      operationId: searchPrivateRoutePlaces
      security: [{ browserSession: [] }]
      description: Explicit temporary lookup through the configured place provider. No persistence or presence. Twenty requests per account per minute.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 256, description: Trimmed text; no semicolon or control characters; at most20 letter/number groups. }
      responses:
        '200':
          description: Temporary places and provider attribution; empty places means no matches
          content:
            application/json:
              schema:
                type: object
                required: [provider, places, attribution]
                properties:
                  provider: { type: string, enum: [mapbox, photon] }
                  attribution: { type: string, minLength: 1, maxLength: 2048 }
                  places:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [id, label, coordinate]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 512 }
                        label: { type: string, minLength: 1, maxLength: 512 }
                        coordinate: { $ref: '#/components/schemas/RouteCoordinate' }
        '400': { description: Invalid search text }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Place provider unavailable }
  /api/v1/planning:
    parameters:
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: getAccountPlanning
      security: [{ browserSession: [] }]
      description: 'Owner-only account copy of planning state (ADR 0062). present=false means no copy exists; the version still counts removals so it never repeats. Enabled only by the default-off server planning backup flag. Explicit reads only; no background sync.'
      responses:
        '200':
          description: The account planning copy, or an absent state carrying the latest version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPlanning' }
        '401': { $ref: '#/components/responses/AuthRejected' }
    post:
      operationId: saveAccountPlanning
      security: [{ browserSession: [] }]
      description: 'Replace the account copy with compare-and-swap on expectedVersion and exact latest-mutation replay. Request bodies up to 264 KiB are accepted on this path only; the stored canonical document may not exceed 256 KiB. Twenty planning writes (saves and deletes) per account per minute.'
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPlanningWrite' }
      responses:
        '200':
          description: Saved account copy or exact latest-mutation replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPlanning' }
        '400': { description: 'Invalid plans, saved places, version or mutation identifier. Empty response body.' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '409': { description: 'Stale expected version or conflicting mutation reuse. Empty response body.' }
        '413': { description: 'Request body over 264 KiB or canonical document over 256 KiB. Empty response body.' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/planning/delete:
    parameters:
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: deleteAccountPlanning
      security: [{ browserSession: [] }]
      description: 'Remove the account copy when its version matches, keeping a content-free record of the next version so a stale device can never match a later copy. Succeeds without change when no copy is present. Local device data is unaffected. Shares the planning write budget.'
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPlanningDelete' }
      responses:
        '200':
          description: The resulting absent state with its version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPlanning' }
        '400': { description: 'Invalid expected version. Empty response body.' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '409': { description: 'The account copy changed since it was checked. Empty response body.' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/routes:
    post:
      operationId: calculatePrivateRoute
      security: [{ browserSession: [] }]
      description: Opt-in routing profile. Sends selected endpoints to the configured routing provider; does not start a journey or publish presence. Twenty requests per account per minute. Results are estimates; empty routes means no route found.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, origin, destination]
              properties:
                mode: { type: string, enum: [driving, walking, cycling] }
                origin: { $ref: '#/components/schemas/RouteCoordinate' }
                destination: { $ref: '#/components/schemas/RouteCoordinate' }
      responses:
        '200':
          description: Private route estimates
          content:
            application/json:
              schema:
                type: object
                required: [provider, calculatedAt, routes]
                properties:
                  provider: { type: string, enum: [mapbox, valhalla] }
                  calculatedAt: { type: string, format: date-time }
                  routes:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [distanceMetres, durationSeconds, geometry]
                      properties:
                        distanceMetres: { type: number, minimum: 0 }
                        durationSeconds: { type: number, minimum: 0 }
                        geometry:
                          type: array
                          minItems: 2
                          maxItems: 10000
                          items: { $ref: '#/components/schemas/RouteCoordinate' }
                        steps:
                          type: array
                          maxItems: 500
                          description: Normalized English turn instructions. Optional only for compatibility with route responses produced before instructions were added.
                          items: { $ref: '#/components/schemas/RouteStep' }
        '400': { description: Invalid mode or endpoints }
        '422': { description: Route endpoints or returned geometry exceed configured routing coverage. Empty body; no region or coordinate details are returned. }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Routing provider unavailable }
  /api/v1/journeys/{id}/signals/{commandId}/community-share:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - $ref: '#/components/parameters/PrivateSignalCommandId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: submitCommunityTrafficShareV3
      security: [{ browserSession: [] }]
      description: Fresh per-report V3 opt-in of one accepted private traffic signal. A candidate is accepted for consideration, never guaranteed publication. Separate default-off production flag; prior public intents are not consent.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityTrafficShareRequestV3' }
      responses:
        '200':
          description: Existing exact owner-bound request or newly committed candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTrafficShareResponseV3' }
        '400': { description: Invalid exact request or identifiers }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Signal or journey unavailable to this owner }
        '409': { description: 'Ineligible authority, account/window conflict or changed exact retry' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Authority or database unavailable; result may require owner recovery }
  /api/v1/journeys/{id}/signals/{commandId}/community-share/stop:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - $ref: '#/components/parameters/PrivateSignalCommandId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: stopCommunityTrafficShareV3
      security: [{ browserSession: [] }]
      description: Stops future V3 consideration. A summary already being prepared may include this report; published aggregates are not recomputed.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSignalStopRequest' }
      responses:
        '200':
          description: Future consideration stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTrafficStopResponseV3' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: No owner-visible share handle }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Outcome uncertain; retry the same Stop }
  /api/v1/community-shares:
    get:
      operationId: recoverOwnCommunityTrafficSharesV3
      security: [{ browserSession: [] }]
      description: Bounded owner-only V3 recovery handles across journeys and devices; no V18/V22 records.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
      responses:
        '200':
          description: Recent own candidate handles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTrafficShareRecoveryV3' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Recovery unavailable; do not resubmit a different request automatically }
  /api/v1/journeys/{id}/community-traffic:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: readRelevantCommunityTrafficV3
      security: [{ browserSession: [] }]
      description: Bounded canonical committed and unexpired V3 rows relevant to server-derived current active journey context. No arbitrary anchor, coordinates, counts or participant data.
      responses:
        '200':
          description: Current canonical community summary rows; empty never implies clear roads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTrafficReadV3' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey unavailable or inactive }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Reader unavailable; do not serve stale cached rows }
  /api/v1/journeys/{id}/community-traffic/{ref}/reports:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: reportVisibleCommunityTrafficV3
      security: [{ browserSession: [] }]
      description: Bounded report of one authorized visible canonical moment. Report does not automatically suppress the row.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommunityTrafficReportRequestV3' }
      responses:
        '202':
          description: Report received for moderation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityTrafficReportResponseV3' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Moment not visible to this journey; no existence disclosure }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Intake unavailable }
  /api/v1/admin/auth/csrf:
    get:
      operationId: adminCsrf
      description: Default-off staging moderator CSRF bootstrap; separate admin cookie namespace and exact admin origin.
      responses:
        '200': { description: Admin CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfToken' } } } }
  /api/v1/admin/auth/google/challenge:
    post:
      operationId: beginAdminGoogleChallenge
      description: Separate one-time admin binding and nonce; requires exact admin Origin and CSRF.
      responses:
        '200': { description: Google challenge, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleChallenge' } } } }
  /api/v1/admin/auth/google/exchange:
    post:
      operationId: exchangeAdminGoogleIdentity
      description: Separate Google audience; resolves an existing enabled account with a current finite traffic grant; never creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, idToken]
              properties:
                challengeId: { type: string, format: uuid }
                idToken: { type: string, maxLength: 16384 }
      responses:
        '200': { description: Admin session, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        '401': { $ref: '#/components/responses/AuthRejected' }
  /api/v1/admin/auth/session:
    get:
      operationId: readAdminSession
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Current admin session, content: { application/json: { schema: { $ref: '#/components/schemas/BrowserSession' } } } }
        '401': { $ref: '#/components/responses/AuthRejected' }
  /api/v1/admin/auth/logout:
    post:
      operationId: revokeAdminSession
      security: [{ adminSession: [] }]
      responses:
        '204': { description: Admin session cookie cleared }
  /api/v1/admin/community-traffic/reports:
    get:
      operationId: readAdminTrafficReportQueue
      security: [{ adminSession: [] }]
      description: Bounded, cursor-paged canonical report groups; unavailable evidence has no value or area detail. Every read is audited. A page may have zero items and a non-null nextCursor when scanned groups closed or expired; continue paging until nextCursor is null.
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Moderator queue, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficQueueV3' } } } }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '404': { description: Current grant unavailable }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/admin/community-traffic/reports/{ref}/dismiss:
    post:
      operationId: dismissAdminTrafficReport
      security: [{ adminSession: [] }]
      parameters:
        - { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficDecisionV3' } } } }
      responses:
        '200': { description: Report group dismissed, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficDecisionResponseV3' } } } }
        '404': { description: No current investigable open group or grant }
        '409': { description: Conflicting request identity replay }
  /api/v1/admin/community-traffic/reports/{ref}/suppress:
    post:
      operationId: suppressAdminTrafficSummary
      security: [{ adminSession: [] }]
      parameters:
        - { name: ref, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficDecisionV3' } } } }
      responses:
        '200': { description: Canonical projection suppressed atomically with audit, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficDecisionResponseV3' } } } }
        '404': { description: No current investigable open group or grant }
        '409': { description: Conflicting request identity replay }
  /api/v1/admin/traffic-grants/me:
    get:
      operationId: readAdminTrafficGrantCapability
      description: Separate default-off V3 grant administration capability for the current admin session.
      security: [{ adminSession: [] }]
      responses:
        '200': { description: Current finite grant-administrator authority, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantCapabilityV3' } } } }
        '401': { $ref: '#/components/responses/AuthRejected' }
  /api/v1/admin/traffic-grants/{targetId}:
    get:
      operationId: readAdminTrafficGrants
      description: Exact enabled target UUID only; no lookup or directory. Unknown, disabled and administrator targets are indistinguishable.
      security: [{ adminSession: [] }]
      parameters:
        - { name: targetId, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      responses:
        '200': { description: Current V3 grants, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantReviewV3' } } } }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { description: Current grant-administrator authority unavailable }
        '404': { description: Target unavailable }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/admin/traffic-grants/{targetId}/issue:
    post:
      operationId: issueAdminTrafficGrant
      description: Issues a finite V3 moderator grant. An active grant must be explicitly revoked before issuing another.
      security: [{ adminSession: [] }]
      parameters:
        - { name: targetId, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantIssueV3' } } } }
      responses:
        '200': { description: Committed grant or exact retained replay, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantReceiptV3' } } } }
        '403': { description: Current grant-administrator authority unavailable }
        '404': { description: Target unavailable }
        '409': { description: Active grant or conflicting request UUID }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/admin/traffic-grants/{targetId}/revoke:
    post:
      operationId: revokeAdminTrafficGrant
      description: Removes one current V3 moderator grant. The next permission check observes revocation.
      security: [{ adminSession: [] }]
      parameters:
        - { name: targetId, in: path, required: true, schema: { $ref: '#/components/schemas/PrivateSignalUuid' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantRevokeV3' } } } }
      responses:
        '200': { description: Committed revocation or exact retained replay, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTrafficGrantReceiptV3' } } } }
        '403': { description: Current grant-administrator authority unavailable }
        '404': { description: Target unavailable }
        '409': { description: No active grant or conflicting request UUID }
        '429': { $ref: '#/components/responses/AuthLimited' }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-routiqo_admin_session
      description: Separate default-off admin session; loopback development uses routiqo_admin_session.
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-routiqo_session
      description: Secure production cookie. Explicit loopback HTTP development uses routiqo_session.
    nativeBearer:
      type: http
      scheme: bearer
      description: Exactly one Authorization header containing Bearer, one space, and a 43-character URL-safe opaque credential.
  parameters:
    PrivateJourneyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil journey UUID.
    PrivateSignalCommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil private command UUID.
    JourneyAccount:
      in: header
      name: X-Routiqo-Account
      required: true
      schema: { type: string, format: uuid }
      description: Expected verified account partition. Must equal the session account; never selects or authenticates an owner. Mismatch/missing returns401 to stop stale queued work after account switching.
    AuthOrigin:
      in: header
      name: Origin
      required: true
      schema: { type: string }
      description: Must exactly match the configured browser origin.
    AuthCsrf:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema: { type: string }
      description: Masked token returned by GET csrf; browser must also send its CSRF cookie.
  responses:
    JourneyResult:
      description: Owned journey lifecycle record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Journey' }
    AuthRejected:
      description: Missing, invalid, expired or revoked authentication; no credential details are returned.
    AuthForbidden:
      description: Origin, fetch metadata or CSRF check failed.
    AuthTooLarge:
      description: Body exceeds 20 KiB.
    AuthMediaType:
      description: POST requires application/json.
    AuthLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          schema: { type: string }
          description: Retry delay in seconds.
    NativeAuthRejected:
      description: Missing, malformed, invalid, expired or revoked native bearer authentication, or prohibited Authorization on challenge/exchange. No credential details are returned.
    NativeTransportRejected:
      description: Cookie, Origin, Sec-Fetch-Site, query string, unknown native route or unsupported method was rejected.
  schemas:
    NativeEmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    NativeGoogleChallenge:
      type: object
      additionalProperties: false
      required: [id, nonce, binding, expiresAt]
      properties:
        id: { type: string, format: uuid }
        nonce: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
        binding: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    NativeExchangeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, binding, idToken]
      properties:
        challengeId: { type: string, format: uuid }
        binding: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        idToken: { type: string, minLength: 1, maxLength: 16384 }
    NativeSession:
      type: object
      additionalProperties: false
      required: [accountId, credential, expiresAt]
      properties:
        accountId: { type: string, format: uuid }
        credential: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    NativeAccount:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
    NativeDeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation, accountId]
      properties:
        confirmation: { type: string, enum: [DELETE] }
        accountId: { type: string, format: uuid, description: Must exactly match the authenticated native session account. }
    TripJournal:
      type: object
      required: [journey, annotation]
      properties:
        journey: { $ref: '#/components/schemas/Journey' }
        annotation: { $ref: '#/components/schemas/TripJournalAnnotation' }
    BrowserJourneyConsent:
      type: object
      additionalProperties: false
      required: [journeyId, generation, sharing, journeyActive]
      properties:
        journeyId: { type: string, format: uuid }
        generation:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal signed-long value encoded as a string to preserve exact JavaScript precision.
        sharing: { type: boolean }
        journeyActive: { type: boolean }
    BrowserJourneyConsentIntent:
      type: object
      additionalProperties: false
      required: [expectedGeneration, sharing]
      properties:
        expectedGeneration:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal string from zero through 9223372036854775807.
        sharing: { type: boolean }
    ProviderAlertsResponse:
      type: object
      additionalProperties: false
      required: [region, scope, source, alerts]
      properties:
        region: { type: string, enum: ['Chennai district area'] }
        scope: { type: string, enum: ['District-wide alerts; not road conditions'] }
        source: { type: string, enum: ['NDMA SACHET'] }
        alerts:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ProviderAlert' }
    ProviderAlert:
      type: object
      additionalProperties: false
      required: [id, event, area, severity, issuer, sourceUrl, issuedAt, expiresAt]
      properties:
        id: { type: string, pattern: '^[0-9]{8,24}$' }
        event: { type: string, maxLength: 120 }
        area: { type: string, maxLength: 140 }
        severity: { type: string, enum: [Minor, Moderate, Severe, Extreme] }
        issuer: { type: string, maxLength: 80 }
        sourceUrl: { type: string, format: uri }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    BrowserRouteContext:
      type: object
      additionalProperties: false
      required: [contextId, revision, anchorIds, issuedAt, expiresAt]
      properties:
        contextId: { type: string, format: uuid }
        revision:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal signed-long value encoded as a string to preserve exact JavaScript precision.
        anchorIds:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: Sorted opaque curated anchor identifiers.
          items: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    BrowserRouteContextRead:
      type: object
      additionalProperties: false
      required: [context]
      properties:
        context:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/BrowserRouteContext' }
    BrowserRouteContextBindingRequest:
      type: object
      additionalProperties: false
      required: [mode, origin, destination, alternativeIndex, expectedContextId]
      properties:
        mode: { type: string, enum: [driving, walking, cycling] }
        origin: { $ref: '#/components/schemas/RouteCoordinate' }
        destination: { $ref: '#/components/schemas/RouteCoordinate' }
        alternativeIndex: { type: integer, minimum: 0, maximum: 2 }
        expectedContextId:
          type: string
          format: uuid
          nullable: true
          pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Required null or canonical lowercase non-nil current context UUID.
    BrowserRouteContextBindingResponse:
      type: object
      additionalProperties: false
      required: [status, context]
      properties:
        status: { type: string, enum: [bound, no_route, no_eligible_anchors] }
        context:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/BrowserRouteContext' }
    BrowserSignalIssueRequest:
      type: object
      additionalProperties: false
      required: [anchorId]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
    BrowserExpectedSignalIssueRequest:
      type: object
      additionalProperties: false
      required: [anchorId, contextId, routeRevision, consentGeneration]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
    BrowserSignalChoice:
      type: object
      additionalProperties: false
      required: [anchorId, displayLabel, categories]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        displayLabel:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain text bounded by Unicode code points; no leading/trailing ASCII space or control, format, separator, surrogate, private-use or unassigned code points.
        categories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [queue, traffic, parking, food_queue, restroom] }
    BrowserSignalChoiceSnapshot:
      type: object
      additionalProperties: false
      required: [contextId, routeRevision, consentGeneration, issuedAt, expiresAt, choices]
      properties:
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        choices:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: Canonical ascending UUID-string order.
          items: { $ref: '#/components/schemas/BrowserSignalChoice' }
    BrowserSignalStopRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    CommunityTrafficShareRequestV3:
      type: object
      additionalProperties: false
      required: [requestId, purpose]
      properties:
        requestId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        purpose: { type: string, enum: [community-traffic-v3] }
    CommunityTrafficShareResponseV3:
      type: object
      additionalProperties: false
      required: [candidateId, commandId, status, acceptedAt, windowEndsAt]
      properties:
        candidateId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [accepted_for_consideration, stopped_for_future_sharing, expired] }
        acceptedAt: { type: string, format: date-time }
        windowEndsAt: { type: string, format: date-time }
    CommunityTrafficStopResponseV3:
      type: object
      additionalProperties: false
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [stopped_for_future_sharing] }
    CommunityTrafficShareHandleV3:
      type: object
      additionalProperties: false
      required: [candidateId, journeyId, commandId, requestId, status, acceptedAt, windowEndsAt]
      properties:
        candidateId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        journeyId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        requestId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [accepted_for_consideration, stopped_for_future_sharing] }
        acceptedAt: { type: string, format: date-time }
        windowEndsAt: { type: string, format: date-time }
    CommunityTrafficShareRecoveryV3:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/CommunityTrafficShareHandleV3' }
    CommunityTrafficReadV3:
      type: object
      additionalProperties: false
      required: [schemaVersion, serverTime, moments]
      properties:
        schemaVersion: { type: integer, enum: [3] }
        serverTime: { type: string, format: date-time, description: Server time captured after the reader query; clients use it for conservative expiry deadlines. }
        moments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CommunityTrafficMomentV3' }
    CommunityTrafficMomentV3:
      type: object
      additionalProperties: false
      required: [ref, areaLabel, trafficValue, observationPeriod, expiresAt, source, schemaVersion]
      properties:
        ref: { $ref: '#/components/schemas/PrivateSignalUuid' }
        areaLabel: { type: string, minLength: 1, maxLength: 80 }
        trafficValue: { type: string, enum: [traffic_moving, traffic_slow, traffic_very_slow, traffic_stopped] }
        observationPeriod: { type: string, minLength: 1, maxLength: 40 }
        expiresAt: { type: string, format: date-time }
        source: { type: string, enum: [community] }
        schemaVersion: { type: integer, enum: [3] }
    CommunityTrafficReportRequestV3:
      type: object
      additionalProperties: false
      required: [reason, clientRequestId]
      properties:
        reason: { type: string, enum: [INACCURATE, UNSAFE, SPAM] }
        clientRequestId: { $ref: '#/components/schemas/PrivateSignalUuid' }
    CommunityTrafficReportResponseV3:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [received] }
    BrowserPublicSignalShareRequest:
      type: object
      additionalProperties: false
      required: [requestId, purpose]
      properties:
        requestId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        purpose: { type: string, enum: [public-live-moment-v1] }
    BrowserPublicSignalShareResponse:
      type: object
      additionalProperties: false
      required: [commandId, status, sharedAt]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [shared] }
        sharedAt: { type: string, format: date-time }
    BrowserPublicSignalStopResponse:
      type: object
      additionalProperties: false
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [stopped] }
    BrowserPublicSignalIntentPage:
      type: object
      additionalProperties: false
      required: [intents, nextCursor]
      properties:
        intents:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/BrowserPublicSignalIntentHandle' }
        nextCursor: { type: string, nullable: true, maxLength: 128 }
    BrowserPublicSignalIntentHandle:
      type: object
      additionalProperties: false
      required: [journeyId, commandId, status, sharedAt]
      properties:
        journeyId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [shared, stopped] }
        sharedAt: { type: string, format: date-time }
    BrowserSignalStopResponse:
      type: object
      additionalProperties: false
      required: [commandId, status, receipt]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [stopped] }
        receipt:
          type: object
          nullable: true
          additionalProperties: false
          required: [commandId, status, receivedAt, expiresAt, retainUntil]
          properties:
            commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
            status: { type: string, enum: [withdrawn, superseded] }
            receivedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            retainUntil: { type: string, format: date-time }
    BrowserSignalAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [anchorId, value, contextId, routeRevision, consentGeneration]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        value: { $ref: '#/components/schemas/QuickSignalValue' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
    BrowserSignalWithdrawRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    BrowserSignalCommandGrant:
      type: object
      additionalProperties: false
      required: [commandId, anchorId, contextId, routeRevision, consentGeneration, categories, issuedAt, expiresAt]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
        categories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [queue, traffic, parking, food_queue, restroom] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    BrowserSignalReceipt:
      type: object
      additionalProperties: false
      required: [commandId, status, receivedAt, expiresAt, retainUntil]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [accepted, withdrawn, superseded] }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        retainUntil: { type: string, format: date-time }
    PrivateSignalUuid:
      type: string
      format: uuid
      pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil UUID.
    PrivateLongString:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Canonical decimal string from zero through 9223372036854775807.
    QuickSignalValue:
      type: string
      enum:
        - queue_under_5
        - queue_5_to_15
        - queue_15_to_30
        - queue_over_30
        - traffic_moving
        - traffic_slow
        - traffic_very_slow
        - traffic_stopped
        - parking_available
        - parking_filling
        - parking_full
        - food_queue_none
        - food_queue_short
        - food_queue_long
        - restroom_usable
        - restroom_busy
        - restroom_problem_reported
    TripJournalAnnotation:
      type: object
      required: [title, notes, version, updatedAt]
      properties:
        title: { type: string, maxLength: 120, description: Plain text; UTF-16 code-unit limit enforced by server }
        notes: { type: string, maxLength: 4000, description: Plain text; UTF-16 code-unit limit enforced by server }
        version: { type: integer, minimum: 0, maximum: 9007199254740991 }
        updatedAt: { type: string, format: date-time, nullable: true }
    TripJournalWrite:
      type: object
      required: [title, notes, expectedVersion, mutationId]
      properties:
        title: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 4000 }
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740990
          description: Exact integer JSON number; no string coercion or fraction truncation. Numeric token at most 64 characters and absolute exponent at most 100.
        mutationId: { type: string, format: uuid }
    AccountPlanningPlan:
      type: object
      additionalProperties: false
      required: [id, kind, origin, destination, date, time, days, notes, createdAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [trip, commute] }
        origin: { type: string, minLength: 1, maxLength: 100, description: Not blank after ECMAScript trim; no control characters }
        destination: { type: string, minLength: 1, maxLength: 100, description: Not blank after ECMAScript trim; no control characters }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: Real calendar date }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        days:
          type: array
          maxItems: 7
          uniqueItems: true
          description: Weekdays 0 (Sunday) to 6. A commute needs at least one.
          items: { type: integer, minimum: 0, maximum: 6 }
        notes: { type: string, maxLength: 500, description: Tab, newline and carriage return are the only permitted control characters }
        createdAt: { type: string, minLength: 1, maxLength: 64 }
    AccountPlanning:
      type: object
      required: [present, version, updatedAt, plans, saved]
      properties:
        present: { type: boolean, description: False when the account has no copy; plans and saved are then empty and updatedAt is null }
        version: { type: integer, minimum: 0, maximum: 9007199254740991, description: 'Compare-and-swap version. Counts saves and removals, so it never repeats; 0 means never saved.' }
        updatedAt: { type: string, format: date-time, nullable: true }
        plans:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AccountPlanningPlan' }
        saved:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[a-z0-9-]{1,80}$' }
    AccountPlanningWrite:
      type: object
      additionalProperties: false
      required: [plans, saved, expectedVersion, mutationId]
      properties:
        plans:
          type: array
          maxItems: 100
          description: Plan ids must be unique.
          items: { $ref: '#/components/schemas/AccountPlanningPlan' }
        saved:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[a-z0-9-]{1,80}$' }
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740990
          description: Exact integer JSON token; fractions, exponents and strings are rejected.
        mutationId: { type: string, format: uuid, description: Lowercase canonical UUID }
    AccountPlanningDelete:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, maximum: 9007199254740991 }
    RouteCoordinate:
      type: array
      description: Longitude then latitude. Longitude must be between -180 and180, latitude between -90 and90. Endpoints must differ.
      minItems: 2
      maxItems: 2
      items: { type: number, minimum: -180, maximum: 180 }
    RouteStep:
      type: object
      additionalProperties: false
      required: [instruction, distanceMetres, durationSeconds, location]
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed plain text without control characters.
        distanceMetres: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        location: { $ref: '#/components/schemas/RouteCoordinate' }
    Journey:
      type: object
      additionalProperties: false
      required: [id, kind, status, startedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [trip, commute] }
        status: { type: string, enum: [active, completed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    JourneyCursor:
      type: object
      nullable: true
      required: [startedAt, id]
      properties:
        startedAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
    NativeHistoryCursor:
      type: object
      additionalProperties: false
      required: [startedAt, id]
      properties:
        startedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{6}Z$'
        id:
          type: string
          format: uuid
          pattern: '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$'
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    GoogleChallenge:
      type: object
      additionalProperties: false
      required: [id, nonce, expiresAt]
      properties:
        id: { type: string, format: uuid }
        nonce: { type: string, minLength: 43, maxLength: 43 }
        expiresAt: { type: string, format: date-time }
    BrowserSession:
      type: object
      additionalProperties: false
      required: [accountId, expiresAt]
      properties:
        accountId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    AdminTrafficQueueV3:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminTrafficQueueItemV3' }
        nextCursor: { type: string, nullable: true }
    AdminTrafficQueueItemV3:
      type: object
      additionalProperties: false
      required: [ref, reasonCounts, evidenceStatus, areaLabel, trafficValue, observationPeriod, expiresAt]
      properties:
        ref: { type: string, format: uuid }
        reasonCounts:
          type: object
          additionalProperties: false
          required: [INACCURATE, UNSAFE, SPAM]
          properties:
            INACCURATE: { type: integer, minimum: 0 }
            UNSAFE: { type: integer, minimum: 0 }
            SPAM: { type: integer, minimum: 0 }
        evidenceStatus: { type: string, enum: [AVAILABLE, EVIDENCE_UNAVAILABLE] }
        areaLabel: { type: string, nullable: true }
        trafficValue: { type: string, nullable: true }
        observationPeriod: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    AdminTrafficDecisionV3:
      type: object
      additionalProperties: false
      required: [requestId, reason]
      properties:
        requestId: { type: string, format: uuid }
        reason: { type: string, enum: [INACCURATE, UNSAFE, SPAM, POLICY] }
    AdminTrafficDecisionResponseV3:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [dismissed, suppressed] }
    AdminTrafficGrantCapabilityV3:
      type: object
      additionalProperties: false
      required: [canManageGrants]
      properties:
        canManageGrants: { type: boolean }
    AdminTrafficGrantReviewV3:
      type: object
      additionalProperties: false
      required: [targetId, grants]
      properties:
        targetId: { type: string, format: uuid }
        grants:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/AdminTrafficGrantV3' }
    AdminTrafficGrantV3:
      type: object
      additionalProperties: false
      required: [permission, expiresAt]
      properties:
        permission: { type: string, enum: [traffic_review, traffic_suppress] }
        expiresAt: { type: string, format: date-time }
    AdminTrafficGrantIssueV3:
      type: object
      additionalProperties: false
      required: [requestId, permission, reason, durationMinutes]
      properties:
        requestId: { type: string, format: uuid }
        permission: { type: string, enum: [traffic_review, traffic_suppress] }
        reason: { $ref: '#/components/schemas/AdminTrafficGrantReasonV3' }
        durationMinutes: { type: integer, minimum: 15, maximum: 240 }
    AdminTrafficGrantRevokeV3:
      type: object
      additionalProperties: false
      required: [requestId, permission, reason]
      properties:
        requestId: { type: string, format: uuid }
        permission: { type: string, enum: [traffic_review, traffic_suppress] }
