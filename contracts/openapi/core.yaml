openapi: 3.0.3
info:
  title: Routiqo core API
  version: 0.15.0
  description: Discovery plus isolated browser and native authentication transports. Auth transports require explicit profiles; default preview denies them. Browser consent, private route-context and private signal-choice and command transports are separately default-off; no public live traffic or user presence.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service]
                properties:
                  status: { type: string, enum: [UP] }
                  service: { type: string, enum: [routiqo-core-api] }
  /api/v1/destinations:
    get:
      operationId: listDestinations
      responses:
        '200':
          description: Curated seed destinations, not live routing information
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Destination' }
  /api/v1/journeys:
    get:
      operationId: listBrowserJourneys
      security: [{ browserSession: [] }]
      description: Owner-scoped keyset history. Cursor fields must be supplied together. No route endpoints or presence are returned.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: beforeStartedAt, schema: { type: string, format: date-time }, description: Microsecond precision; pair with beforeId. }
        - { in: query, name: beforeId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Bounded journey history
          content:
            application/json:
              schema:
                type: object
                required: [journeys, next]
                properties:
                  journeys: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Journey' } }
                  next: { $ref: '#/components/schemas/JourneyCursor' }
        '400': { description: Invalid page size or cursor }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '429': { $ref: '#/components/responses/AuthLimited' }
    post:
      operationId: startBrowserJourney
      security: [{ browserSession: [] }]
      description: Retry with the same UUID and kind. Returns the original record even after completion; never restarts a completed journey. Owner comes only from the session.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind]
              properties:
                id: { type: string, format: uuid }
                kind: { type: string, enum: [trip, commute] }
      responses:
        '200': { $ref: '#/components/responses/JourneyResult' }
        '400': { description: Invalid identifier, kind or JSON }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '409': { description: Journey identity/kind conflict or another active journey }
        '503': { description: Journey write temporarily unavailable; retry the same command without changing its identity. Empty response body. }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/journeys/{id}:
    parameters:
      - { $ref: '#/components/parameters/JourneyAccount' }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBrowserJourney
      security: [{ browserSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/JourneyResult' }
        '400': { description: Invalid identifier }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey absent or inaccessible }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/journeys/{id}/complete:
    parameters:
      - { $ref: '#/components/parameters/JourneyAccount' }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeBrowserJourney
      security: [{ browserSession: [] }]
      description: Owner-only idempotent completion using server time; repeats return the original completion.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/JourneyResult' }
        '503': { description: Journey write temporarily unavailable; retry the same completion command. Empty response body. }
        '400': { description: Invalid identifier }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey absent or inaccessible }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/csrf:
    get:
      operationId: getBrowserCsrf
      description: Same-origin bootstrap. Sets an HttpOnly CSRF cookie; send the returned masked token in X-XSRF-TOKEN for POST requests. Responses are no-store.
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/google/challenge:
    post:
      operationId: beginGoogleBrowserLogin
      description: Creates a five-minute challenge and sets its HttpOnly binding cookie. A newer challenge replaces the browser binding; no raw binding is returned.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Pass nonce to Google sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleChallenge' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/google/exchange:
    post:
      operationId: exchangeGoogleBrowserLogin
      description: Requires the challenge binding cookie. Sets a 15-minute HttpOnly session cookie and clears binding. Session credentials never appear in the response body. No refresh token yet.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, idToken]
              properties:
                challengeId: { type: string, format: uuid }
                idToken: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        '200':
          description: Browser session established
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '400': { description: Invalid JSON or request fields }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/session:
    get:
      operationId: getBrowserSession
      security: [{ browserSession: [] }]
      responses:
        '200':
          description: Enabled account for an unexpired, unrevoked browser session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountId]
                properties:
                  accountId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/session/renew:
    post:
      operationId: renewBrowserSession
      security: [{ browserSession: [] }]
      description: Rotates a valid session in its last five minutes; otherwise returns its existing expiry. HttpOnly cookie only. Original Google authentication limits all replacements to 12 hours. Expired or revoked credentials cannot renew. A lost rotation response may require sign-in again.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Current or renewed browser session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/account/delete:
    post:
      operationId: deleteBrowserAccount
      security: [{ browserSession: [] }]
      description: Deletes this Routiqo account, its server journeys and all sessions. Requires Google authentication within five minutes; renewal does not reset that time. Local plans and the Google account remain unchanged. Reauthentication must be followed by explicit confirmation again.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation, accountId]
              properties:
                confirmation: { type: string, enum: [DELETE] }
                accountId: { type: string, format: uuid, description: Must match the session account shown when confirmation opened; rejects account switches in other tabs. }
      responses:
        '204': { description: Account deleted; session and binding cookies cleared }
        '400': { description: Explicit confirmation required or invalid JSON }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '428': { description: Sign in with Google again, then explicitly reconfirm deletion }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/auth/logout:
    post:
      operationId: logoutBrowserSession
      description: Idempotently revokes the supplied session and clears session/binding cookies. CSRF is required even if already signed out.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/google/challenge:
    post:
      operationId: beginNativeGoogleLogin
      security: []
      description: Creates a five-minute one-use challenge. Authorization, cookies, browser-origin headers and query strings are rejected. The binding remains only in native sign-in coordination memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSignalWithdrawRequest' }
      responses:
        '200':
          description: Native Google challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeGoogleChallenge' }
        '400': { description: Body is not the exact empty JSON object }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/google/exchange:
    post:
      operationId: exchangeNativeGoogleLogin
      security: []
      description: Verifies the one-use bound Google challenge and returns a 15-minute opaque native credential. Authorization, cookies, browser-origin headers and query strings are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeExchangeRequest' }
      responses:
        '200':
          description: Native session established
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeSession' }
        '400': { description: Invalid JSON, non-canonical identifier or request fields }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/session:
    get:
      operationId: getNativeSession
      security: [{ nativeBearer: [] }]
      description: Returns the enabled account for exactly one unexpired, unrevoked native bearer credential. Cookies, browser-origin headers and query strings are rejected.
      responses:
        '200':
          description: Current native account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeAccount' }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/session/renew:
    post:
      operationId: renewNativeSession
      security: [{ nativeBearer: [] }]
      description: Returns the current session or atomically rotates it in its last five minutes. The Google-authenticated lineage remains bounded to 12 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeEmptyRequest' }
      responses:
        '200':
          description: Current or renewed native session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeSession' }
        '400': { description: Body is not the exact empty JSON object }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/logout:
    post:
      operationId: logoutNativeSession
      security: [{ nativeBearer: [] }]
      description: Idempotently revokes the credential lineage. A retained rotated predecessor also revokes its active replacement; an unknown syntactically valid credential has no effect.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeEmptyRequest' }
      responses:
        '204': { description: Credential lineage revoked or already absent }
        '400': { description: Body is not the exact empty JSON object }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/native/auth/account/delete:
    post:
      operationId: deleteNativeAccount
      security: [{ nativeBearer: [] }]
      description: Deletes the matching Routiqo account and all sessions. Requires Google authentication within five minutes; renewal does not reset that time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeDeleteAccountRequest' }
      responses:
        '204': { description: Account deleted and all session lineages revoked }
        '400': { description: Explicit confirmation, canonical account identifier and exact fields are required }
        '401': { $ref: '#/components/responses/NativeAuthRejected' }
        '403': { $ref: '#/components/responses/NativeTransportRejected' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '428': { description: Sign in with Google again, then explicitly reconfirm deletion }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/journeys/{id}/journal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: getPrivateTripJournal
      security: [{ browserSession: [] }]
      description: Private journal for an owned completed trip; an unsaved annotation has version0. Commutes and active journeys are ineligible.
      responses:
        '200':
          description: Completed trip and private annotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripJournal' }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Journey is not a completed trip }
    post:
      operationId: savePrivateTripJournal
      security: [{ browserSession: [] }]
      description: Save plain-text annotations with optimistic concurrency and latest-mutation replay protection. Twenty writes per account per minute. Empty title and notes clear the annotation content.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripJournalWrite' }
      responses:
        '200':
          description: Saved completed-trip journal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripJournal' }
        '400': { description: Invalid annotation, mutation identifier or version }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Ineligible journey, stale version or conflicting mutation reuse }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
  /api/v1/journeys/{id}/consent:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: getPrivateJourneyConsent
      security: [{ browserSession: [] }]
      description: Returns the authenticated owner's private consent state. Separately enabled by the default-off server consent API flag. Sixty reads per account per minute.
      responses:
        '200':
          description: Current private journey consent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserJourneyConsent' }
        '400': { description: Invalid canonical journey identifier }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Consent authority or rate store temporarily unavailable. Empty response body. }
    post:
      operationId: submitPrivateJourneyConsentIntent
      security: [{ browserSession: [] }]
      description: Applies an explicit consent intent. Enables require the exact current generation and are never automatically retried; stale or current disables take precedence. Ten enables or twenty disables per account per minute.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserJourneyConsentIntent' }
      responses:
        '200':
          description: Current committed private journey consent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserJourneyConsent' }
        '400': { description: Invalid canonical journey identifier or exact JSON intent }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Consent generation conflict or completed-journey enable }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Consent authority or rate store temporarily unavailable. Empty response body. }
  /api/v1/journeys/{id}/route-context:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        description: Canonical lowercase non-nil journey UUID.
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: getPrivateJourneyRouteContext
      security: [{ browserSession: [] }]
      description: Returns the authenticated owner's current private route context without renewing or creating it. Separately enabled by the default-off route binding API flag. Sixty reads per account per minute.
      responses:
        '200':
          description: Current context, or null when no current context exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserRouteContextRead' }
        '400': { description: Invalid canonical journey identifier or query string }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Context authority, session store or rate store temporarily unavailable. Empty response body. }
    post:
      operationId: bindPrivateJourneyRouteContext
      security: [{ browserSession: [] }]
      description: Resolves one selected private route and atomically binds its eligible catalog anchors. Empty outcomes preserve the previous context. Ten bindings per account per minute. The same-origin proxy allows one bounded 25 second request and never retries.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserRouteContextBindingRequest' }
      responses:
        '200':
          description: Binding outcome; only bound includes a context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserRouteContextBindingResponse' }
        '400': { description: Invalid canonical journey identifier or exact binding JSON }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Stale context expectation, inactive consent, completed journey or binding conflict }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Provider, persistence, session or rate infrastructure unavailable. Empty response body. }
  /api/v1/journeys/{id}/signal-commands:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: issuePrivateSignalCommand
      security: [{ browserSession: [] }]
      description: Issues a private short-lived command from current owned journey, consent, bound context and catalog authority. Separately default off. Thirty requests and ten successful grants per account per minute.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSignalIssueRequest' }
      responses:
        '200':
          description: Private signal command grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSignalCommandGrant' }
        '400': { description: Invalid canonical path identifier or exact JSON request }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Current journey, consent, context, anchor or catalog authority denied issuance }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Session, authority or rate infrastructure unavailable. Empty response body. }
  /api/v1/journeys/{id}/signal-choices:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    get:
      operationId: getPrivateSignalChoices
      security: [{ browserSession: [] }]
      description: Returns a bounded minimized owner snapshot for explicit private contribution choice. It issues no grant and discloses no coordinates or public state. Thirty reads per account per minute.
      responses:
        '200':
          description: Current private signal choice snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSignalChoiceSnapshot' }
        '400': { description: Invalid canonical path identifier or query string }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: 'Current journey, consent, context, restriction, provenance or display metadata unavailable' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: 'Session, authority or rate infrastructure unavailable. Empty response body.' }
  /api/v1/journeys/{id}/signal-commands/expected-context:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: issueExpectedContextPrivateSignalCommand
      security: [{ browserSession: [] }]
      description: Issues once only when the submitted private context and revision tuple remains current. It shares legacy issuance request and successful-grant quotas and is never automatically retried.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserExpectedSignalIssueRequest' }
      responses:
        '200':
          description: Private signal command grant matching the submitted tuple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSignalCommandGrant' }
        '400': { description: Invalid canonical path identifier or exact JSON request }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Submitted context tuple or current private authority denied issuance }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: 'Session, authority or rate infrastructure unavailable. Empty response body.' }
  /api/v1/journeys/{id}/signals/{commandId}:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - $ref: '#/components/parameters/PrivateSignalCommandId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: acceptPrivateSignalCommand
      security: [{ browserSession: [] }]
      description: Accepts a command once with a 15-minute private evidence lifetime and 24-hour private receipt retention, or returns an exact retained replay without renewal. Sixty requests and five new acceptances per account per minute.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserSignalAcceptanceRequest' }
      responses:
        '200':
          description: New acceptance or exact retained private replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSignalReceipt' }
        '400': { description: Invalid canonical path identifier or exact JSON fingerprint }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Missing, expired, denied or conflicting command/fingerprint }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Session, authority or rate infrastructure unavailable. Empty response body. }
  /api/v1/journeys/{id}/signals/{commandId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/PrivateJourneyId'
      - $ref: '#/components/parameters/PrivateSignalCommandId'
      - { $ref: '#/components/parameters/JourneyAccount' }
    post:
      operationId: withdrawPrivateSignalCommand
      security: [{ browserSession: [] }]
      description: Idempotently makes a retained private receipt terminal without renewal or physical erasure. Thirty requests per account per minute.
      parameters:
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeEmptyRequest' }
      responses:
        '200':
          description: Retained terminal receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSignalReceipt' }
        '400': { description: Invalid canonical path identifier or nonempty JSON request }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '404': { description: Journey missing or not owned by this account }
        '409': { description: Missing, foreign or expired command }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Session, authority or rate infrastructure unavailable. Empty response body. }
  /api/v1/routes/places:
    post:
      operationId: searchPrivateRoutePlaces
      security: [{ browserSession: [] }]
      description: Explicit temporary lookup through the configured place provider. No persistence or presence. Twenty requests per account per minute.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 256, description: Trimmed text; no semicolon or control characters; at most20 letter/number groups. }
      responses:
        '200':
          description: Temporary places and provider attribution; empty places means no matches
          content:
            application/json:
              schema:
                type: object
                required: [provider, places, attribution]
                properties:
                  provider: { type: string, enum: [mapbox, photon] }
                  attribution: { type: string, minLength: 1, maxLength: 2048 }
                  places:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      required: [id, label, coordinate]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 512 }
                        label: { type: string, minLength: 1, maxLength: 512 }
                        coordinate: { $ref: '#/components/schemas/RouteCoordinate' }
        '400': { description: Invalid search text }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Place provider unavailable }
  /api/v1/routes:
    post:
      operationId: calculatePrivateRoute
      security: [{ browserSession: [] }]
      description: Opt-in routing profile. Sends selected endpoints to the configured routing provider; does not start a journey or publish presence. Twenty requests per account per minute. Results are estimates; empty routes means no route found.
      parameters:
        - { $ref: '#/components/parameters/JourneyAccount' }
        - { $ref: '#/components/parameters/AuthOrigin' }
        - { $ref: '#/components/parameters/AuthCsrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, origin, destination]
              properties:
                mode: { type: string, enum: [driving, walking, cycling] }
                origin: { $ref: '#/components/schemas/RouteCoordinate' }
                destination: { $ref: '#/components/schemas/RouteCoordinate' }
      responses:
        '200':
          description: Private route estimates
          content:
            application/json:
              schema:
                type: object
                required: [provider, calculatedAt, routes]
                properties:
                  provider: { type: string, enum: [mapbox, valhalla] }
                  calculatedAt: { type: string, format: date-time }
                  routes:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [distanceMetres, durationSeconds, geometry]
                      properties:
                        distanceMetres: { type: number, minimum: 0 }
                        durationSeconds: { type: number, minimum: 0 }
                        geometry:
                          type: array
                          minItems: 2
                          maxItems: 10000
                          items: { $ref: '#/components/schemas/RouteCoordinate' }
                        steps:
                          type: array
                          maxItems: 500
                          description: Normalized English turn instructions. Optional only for compatibility with route responses produced before instructions were added.
                          items: { $ref: '#/components/schemas/RouteStep' }
        '400': { description: Invalid mode or endpoints }
        '422': { description: Route endpoints or returned geometry exceed configured routing coverage. Empty body; no region or coordinate details are returned. }
        '401': { $ref: '#/components/responses/AuthRejected' }
        '403': { $ref: '#/components/responses/AuthForbidden' }
        '413': { $ref: '#/components/responses/AuthTooLarge' }
        '415': { $ref: '#/components/responses/AuthMediaType' }
        '429': { $ref: '#/components/responses/AuthLimited' }
        '503': { description: Routing provider unavailable }
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-routiqo_session
      description: Secure production cookie. Explicit loopback HTTP development uses routiqo_session.
    nativeBearer:
      type: http
      scheme: bearer
      description: Exactly one Authorization header containing Bearer, one space, and a 43-character URL-safe opaque credential.
  parameters:
    PrivateJourneyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil journey UUID.
    PrivateSignalCommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil private command UUID.
    JourneyAccount:
      in: header
      name: X-Routiqo-Account
      required: true
      schema: { type: string, format: uuid }
      description: Expected verified account partition. Must equal the session account; never selects or authenticates an owner. Mismatch/missing returns401 to stop stale queued work after account switching.
    AuthOrigin:
      in: header
      name: Origin
      required: true
      schema: { type: string }
      description: Must exactly match the configured browser origin.
    AuthCsrf:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema: { type: string }
      description: Masked token returned by GET csrf; browser must also send its CSRF cookie.
  responses:
    JourneyResult:
      description: Owned journey lifecycle record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Journey' }
    AuthRejected:
      description: Missing, invalid, expired or revoked authentication; no credential details are returned.
    AuthForbidden:
      description: Origin, fetch metadata or CSRF check failed.
    AuthTooLarge:
      description: Body exceeds 20 KiB.
    AuthMediaType:
      description: POST requires application/json.
    AuthLimited:
      description: Request rate exceeded.
      headers:
        Retry-After:
          schema: { type: string }
          description: Retry delay in seconds.
    NativeAuthRejected:
      description: Missing, malformed, invalid, expired or revoked native bearer authentication, or prohibited Authorization on challenge/exchange. No credential details are returned.
    NativeTransportRejected:
      description: Cookie, Origin, Sec-Fetch-Site, query string, unknown native route or unsupported method was rejected.
  schemas:
    NativeEmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    NativeGoogleChallenge:
      type: object
      additionalProperties: false
      required: [id, nonce, binding, expiresAt]
      properties:
        id: { type: string, format: uuid }
        nonce: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        binding: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    NativeExchangeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, binding, idToken]
      properties:
        challengeId: { type: string, format: uuid }
        binding: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        idToken: { type: string, minLength: 1, maxLength: 16384 }
    NativeSession:
      type: object
      additionalProperties: false
      required: [accountId, credential, expiresAt]
      properties:
        accountId: { type: string, format: uuid }
        credential: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
    NativeAccount:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
    NativeDeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation, accountId]
      properties:
        confirmation: { type: string, enum: [DELETE] }
        accountId: { type: string, format: uuid, description: Must exactly match the authenticated native session account. }
    TripJournal:
      type: object
      required: [journey, annotation]
      properties:
        journey: { $ref: '#/components/schemas/Journey' }
        annotation: { $ref: '#/components/schemas/TripJournalAnnotation' }
    BrowserJourneyConsent:
      type: object
      additionalProperties: false
      required: [journeyId, generation, sharing, journeyActive]
      properties:
        journeyId: { type: string, format: uuid }
        generation:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal signed-long value encoded as a string to preserve exact JavaScript precision.
        sharing: { type: boolean }
        journeyActive: { type: boolean }
    BrowserJourneyConsentIntent:
      type: object
      additionalProperties: false
      required: [expectedGeneration, sharing]
      properties:
        expectedGeneration:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal string from zero through 9223372036854775807.
        sharing: { type: boolean }
    BrowserRouteContext:
      type: object
      additionalProperties: false
      required: [contextId, revision, anchorIds, issuedAt, expiresAt]
      properties:
        contextId: { type: string, format: uuid }
        revision:
          type: string
          minLength: 1
          maxLength: 19
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Canonical decimal signed-long value encoded as a string to preserve exact JavaScript precision.
        anchorIds:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: Sorted opaque curated anchor identifiers.
          items: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    BrowserRouteContextRead:
      type: object
      additionalProperties: false
      required: [context]
      properties:
        context:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/BrowserRouteContext' }
    BrowserRouteContextBindingRequest:
      type: object
      additionalProperties: false
      required: [mode, origin, destination, alternativeIndex, expectedContextId]
      properties:
        mode: { type: string, enum: [driving, walking, cycling] }
        origin: { $ref: '#/components/schemas/RouteCoordinate' }
        destination: { $ref: '#/components/schemas/RouteCoordinate' }
        alternativeIndex: { type: integer, minimum: 0, maximum: 2 }
        expectedContextId:
          type: string
          format: uuid
          nullable: true
          pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: Required null or canonical lowercase non-nil current context UUID.
    BrowserRouteContextBindingResponse:
      type: object
      additionalProperties: false
      required: [status, context]
      properties:
        status: { type: string, enum: [bound, no_route, no_eligible_anchors] }
        context:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/BrowserRouteContext' }
    BrowserSignalIssueRequest:
      type: object
      additionalProperties: false
      required: [anchorId]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
    BrowserExpectedSignalIssueRequest:
      type: object
      additionalProperties: false
      required: [anchorId, contextId, routeRevision, consentGeneration]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
    BrowserSignalChoice:
      type: object
      additionalProperties: false
      required: [anchorId, displayLabel, categories]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        displayLabel:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain text bounded by Unicode code points; no leading/trailing ASCII space or control, format, separator, surrogate, private-use or unassigned code points.
        categories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [queue, traffic, parking, food_queue, restroom] }
    BrowserSignalChoiceSnapshot:
      type: object
      additionalProperties: false
      required: [contextId, routeRevision, consentGeneration, issuedAt, expiresAt, choices]
      properties:
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        choices:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: Canonical ascending UUID-string order.
          items: { $ref: '#/components/schemas/BrowserSignalChoice' }
    BrowserSignalAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [anchorId, value, contextId, routeRevision, consentGeneration]
      properties:
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        value: { $ref: '#/components/schemas/QuickSignalValue' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
    BrowserSignalWithdrawRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    BrowserSignalCommandGrant:
      type: object
      additionalProperties: false
      required: [commandId, anchorId, contextId, routeRevision, consentGeneration, categories, issuedAt, expiresAt]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        anchorId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        contextId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        routeRevision: { $ref: '#/components/schemas/PrivateLongString' }
        consentGeneration: { $ref: '#/components/schemas/PrivateLongString' }
        categories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [queue, traffic, parking, food_queue, restroom] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    BrowserSignalReceipt:
      type: object
      additionalProperties: false
      required: [commandId, status, receivedAt, expiresAt, retainUntil]
      properties:
        commandId: { $ref: '#/components/schemas/PrivateSignalUuid' }
        status: { type: string, enum: [accepted, withdrawn, superseded] }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        retainUntil: { type: string, format: date-time }
    PrivateSignalUuid:
      type: string
      format: uuid
      pattern: '^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase non-nil UUID.
    PrivateLongString:
      type: string
      minLength: 1
      maxLength: 19
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Canonical decimal string from zero through 9223372036854775807.
    QuickSignalValue:
      type: string
      enum:
        - queue_under_5
        - queue_5_to_15
        - queue_15_to_30
        - queue_over_30
        - traffic_moving
        - traffic_slow
        - traffic_very_slow
        - traffic_stopped
        - parking_available
        - parking_filling
        - parking_full
        - food_queue_none
        - food_queue_short
        - food_queue_long
        - restroom_usable
        - restroom_busy
        - restroom_problem_reported
    TripJournalAnnotation:
      type: object
      required: [title, notes, version, updatedAt]
      properties:
        title: { type: string, maxLength: 120, description: Plain text; UTF-16 code-unit limit enforced by server }
        notes: { type: string, maxLength: 4000, description: Plain text; UTF-16 code-unit limit enforced by server }
        version: { type: integer, minimum: 0, maximum: 9007199254740991 }
        updatedAt: { type: string, format: date-time, nullable: true }
    TripJournalWrite:
      type: object
      required: [title, notes, expectedVersion, mutationId]
      properties:
        title: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 4000 }
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740990
          description: Exact integer JSON number; no string coercion or fraction truncation. Numeric token at most 64 characters and absolute exponent at most 100.
        mutationId: { type: string, format: uuid }
    RouteCoordinate:
      type: array
      description: Longitude then latitude. Longitude must be between -180 and180, latitude between -90 and90. Endpoints must differ.
      minItems: 2
      maxItems: 2
      items: { type: number, minimum: -180, maximum: 180 }
    RouteStep:
      type: object
      additionalProperties: false
      required: [instruction, distanceMetres, durationSeconds, location]
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed plain text without control characters.
        distanceMetres: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        location: { $ref: '#/components/schemas/RouteCoordinate' }
    Journey:
      type: object
      additionalProperties: false
      required: [id, kind, status, startedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [trip, commute] }
        status: { type: string, enum: [active, completed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    JourneyCursor:
      type: object
      nullable: true
      required: [startedAt, id]
      properties:
        startedAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    GoogleChallenge:
      type: object
      additionalProperties: false
      required: [id, nonce, expiresAt]
      properties:
        id: { type: string, format: uuid }
        nonce: { type: string, minLength: 43, maxLength: 43 }
        expiresAt: { type: string, format: date-time }
    BrowserSession:
      type: object
      additionalProperties: false
      required: [accountId, expiresAt]
      properties:
        accountId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
    Destination:
      type: object
      additionalProperties: false
      required: [id, name, region, category, eyebrow, description, detail, highlights, image, imageAlt, travelLabel, accent]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        category: { type: string, enum: [Coast, Hills, Heritage] }
        eyebrow: { type: string }
        description: { type: string }
        detail: { type: string }
        highlights: { type: array, items: { type: string }, maxItems: 10 }
        image: { type: string }
        imageAlt: { type: string }
        travelLabel: { type: string }
        accent: { type: string }
